<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Changelog</title>
<style>
:root { --bg:#fff; --fg:#111; --soft:#5c6570; --line:#eceff3; --side:#f7f8fa; --link:#1a73e8; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
body { display: grid; grid-template-columns: 280px 1fr; }
aside { background: var(--side); border-right: 1px solid var(--line); overflow: auto; padding: 28px 18px; }
aside h1 { margin: 0 0 22px; font-size: 22px; font-weight: 650; }
.group { margin: 0 0 16px; }
.group button.g { display: block; width: 100%; text-align: left; border: none; background: none; font: 600 13px/1.3 inherit; color: var(--soft); padding: 4px 8px; border-radius: 6px; cursor: pointer; }
.group button.item { display: block; width: 100%; text-align: left; border: none; background: none; font: 400 14px/1.35 inherit; color: var(--fg); padding: 6px 8px 6px 16px; border-radius: 6px; cursor: pointer; }
.group button.on { background: #fff; }
main { overflow: auto; }
article { max-width: 720px; margin: 0 auto; padding: 72px 32px 48px; }
.date { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--link); margin: 0 0 14px; }
article h2 { margin: 0 0 16px; font-size: 40px; line-height: 1.15; font-weight: 650; letter-spacing: -0.02em; }
article p { margin: 0; font-size: 18px; line-height: 1.45; color: #3c4450; }
article p.when { margin-top: 12px; font-size: 16px; color: var(--soft); }
article p.when b { color: var(--fg); font-weight: 600; }
table.words { width: 100%; margin-top: 28px; border-collapse: collapse; font-size: 15px; line-height: 1.4; }
table.words th { text-align: left; font: 600 12px/1 inherit; letter-spacing: .06em; text-transform: uppercase; color: var(--soft); padding: 0 12px 10px 0; }
table.words td { vertical-align: top; padding: 10px 12px 10px 0; border-top: 1px solid var(--line); }
table.words td:first-child { color: var(--soft); text-decoration: line-through; text-decoration-color: #c5cad1; }
figure { margin: 28px 0 0; }
figure + figure { margin-top: 20px; }
figcaption { font: 600 12px/1 inherit; letter-spacing: .06em; text-transform: uppercase; color: var(--soft); margin: 0 0 8px; }
figure img { display: block; width: 100%; border-radius: 12px; border: 1px solid var(--line); }
nav.step { display: flex; justify-content: space-between; max-width: 720px; margin: 0 auto; padding: 0 32px 64px; }
nav.step button { border: none; background: none; font: 500 14px inherit; color: var(--link); cursor: pointer; padding: 0; }
nav.step button:disabled { visibility: hidden; }
</style>
</head>
<body>
<aside>
  <h1>Changelog</h1>
  <div id="groups"></div>
</aside>
<main>
  <article id="entry"></article>
  <nav class="step">
    <button id="prev" type="button">Previous</button>
    <button id="next" type="button">Next</button>
  </nav>
</main>
<script type="application/json" id="changelog-config">
{
  "title": "Changelog",
  "groups": [
    {
      "name": "Example",
      "entries": [
        {
          "date": "30 Oct 2026",
          "title": "One change",
          "body": "Say what changed in one sentence.",
          "when": "Say what a person does to see it.",
          "shots": [
            { "label": "Before", "src": "shots/example-before.png" },
            { "label": "After", "src": "shots/example-after.png" }
          ]
        }
      ]
    }
  ]
}
</script>
<script>
const cfg = JSON.parse(document.getElementById("changelog-config").textContent);
document.title = cfg.title || "Changelog";
const flat = [];
for (const group of cfg.groups) {
  for (const entry of group.entries) flat.push({ group: group.name, ...entry });
}
let index = 0;
const groupsEl = document.getElementById("groups");
const entryEl = document.getElementById("entry");
const prev = document.getElementById("prev");
const next = document.getElementById("next");

function renderGroups() {
  groupsEl.replaceChildren();
  for (const group of cfg.groups) {
    const wrap = document.createElement("div");
    wrap.className = "group";
    const label = document.createElement("button");
    label.type = "button";
    label.className = "g";
    label.textContent = group.name;
    const first = flat.findIndex((item) => item.group === group.name);
    label.onclick = () => show(first);
    wrap.append(label);
    for (const entry of group.entries) {
      const at = flat.indexOf(flat.find((item) => item.title === entry.title && item.group === group.name));
      const button = document.createElement("button");
      button.type = "button";
      button.className = "item" + (at === index ? " on" : "");
      button.textContent = entry.title;
      button.onclick = () => show(at);
      wrap.append(button);
    }
    groupsEl.append(wrap);
  }
}

function show(at) {
  index = Math.max(0, Math.min(flat.length - 1, at));
  const item = flat[index];
  entryEl.replaceChildren();
  const date = document.createElement("p");
  date.className = "date";
  date.textContent = [item.date, item.group].filter(Boolean).join("  ·  ");
  const title = document.createElement("h2");
  title.textContent = item.title;
  const body = document.createElement("p");
  body.textContent = item.body;
  entryEl.append(date, title, body);
  if (item.when) {
    const when = document.createElement("p");
    when.className = "when";
    const label = document.createElement("b");
    label.textContent = "When: ";
    when.append(label, item.when);
    entryEl.append(when);
  }
  if (item.words) {
    const table = document.createElement("table");
    table.className = "words";
    const head = table.insertRow();
    for (const label of ["Before", "After"]) {
      const th = document.createElement("th");
      th.textContent = label;
      head.append(th);
    }
    for (const pair of item.words) {
      const row = table.insertRow();
      row.insertCell().textContent = pair.before;
      row.insertCell().textContent = pair.after;
    }
    entryEl.append(table);
  }
  for (const shot of item.shots ?? []) {
    const figure = document.createElement("figure");
    if (shot.label) {
      const caption = document.createElement("figcaption");
      caption.textContent = shot.label;
      figure.append(caption);
    }
    const img = document.createElement("img");
    img.src = shot.src;
    img.alt = [item.title, shot.label].filter(Boolean).join(", ");
    figure.append(img);
    entryEl.append(figure);
  }
  prev.disabled = index === 0;
  next.disabled = index === flat.length - 1;
  renderGroups();
}

prev.onclick = () => show(index - 1);
next.onclick = () => show(index + 1);
document.addEventListener("keydown", (event) => {
  if (event.key === "ArrowRight") show(index + 1);
  if (event.key === "ArrowLeft") show(index - 1);
});
show(0);
</script>
</body>
</html>
