onboarding = false

# catppuccin's secondary-text tokens sit near 3:1 on the panel background, under
# the readable threshold. Lifting them here fixes every dim surface in herdr -
# sidebar sub-rows, command palette, help overlay - not just the agents panel.
[theme]
name = "catppuccin"

[theme.custom]
overlay0 = "#8b91a8"
subtext0 = "#c3cadb"
surface1 = "#585b70"

[update]
channel = "preview"

[keys]
new_tab = "ctrl+shift+n"
split_vertical = "ctrl+n"
split_horizontal = "ctrl+shift+h"
cycle_pane_previous = "alt+left"
cycle_pane_next = "alt+right"
previous_tab = "ctrl+alt+left"
next_tab = "ctrl+alt+right"
# ctrl+w was too easy to fat-finger and herdr never confirms a pane close
close_pane = "ctrl+shift+w"
zoom = "ctrl+shift+z"
toggle_sidebar = "ctrl+shift+b"

# nunoras.open-path: select a file path in a pane, then press one of these.
[[keys.command]]
key = "ctrl+shift+o"
type = "shell"
command = "herdr plugin action invoke open --plugin nunoras.open-path"

[[keys.command]]
key = "ctrl+shift+e"
type = "shell"
command = "herdr plugin action invoke reveal --plugin nunoras.open-path"

[ui]
agent_panel_sort = "priority"
hide_tab_bar_when_single_tab = false
tab_bar_position = "top"
pane_gaps = false
prompt_new_tab_name = false
sidebar_collapsed_mode = "hidden"
# two-line agent entries clip at the default 36
sidebar_max_width = 44
show_agent_labels_on_pane_borders = true
mouse_scroll_lines = 5

# Redesigned 2026-08-25 (Nuno's call, marker "no glyph, colour on state").
# The header is just the repo name, so a project is told apart by its name, not a
# marker. No $color glyph anywhere: herdr can't set a per-project background or a
# per-agent border (checked against 0.8.2 source), and the only way to carry a
# per-project colour is an emoji in the token value, which read as cutesy. So the
# one colour that varies - agent state - is carried by state_icon, which herdr
# tints per state. The nunoras.project-colors plugin still stamps $color, but
# nothing renders it now; disable it if it is never coming back.
[ui.sidebar.spaces]
row_gap = 1
rows = [[{ token = "workspace", bold = true }]]

# One line per agent: the state dot herdr colours, then the title. No second row,
# no glyph, row_gap 0 - the group header already separates the projects.
[ui.sidebar.agents]
row_gap = 0
rows = [["state_icon", { token = "tab", fg = "#cdd6f4" }]]

[ui.toast]
delivery = "system"
delay_seconds = 1
