id = "nunoras.open-path"
name = "Open path"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Open a file path from a pane in the editor, or reveal it in Explorer"
platforms = ["windows"]

# Select the path in a pane, then invoke one of these.
# The action reads `selected_text` out of HERDR_PLUGIN_CONTEXT_JSON.

[[actions]]
id = "open"
title = "Open path in editor"
contexts = ["selection"]
command = ["pwsh", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/open-path.ps1", "-Mode", "open"]

[[actions]]
id = "reveal"
title = "Reveal path in Explorer"
contexts = ["selection"]
command = ["pwsh", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/open-path.ps1", "-Mode", "reveal"]

# Kept as a diagnostic: point a link handler at this to dump whatever herdr sends.
[[actions]]
id = "probe"
title = "Probe clicked link"
contexts = ["global"]
command = ["pwsh", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/probe.ps1"]

# Ctrl+click a file:// link in a pane -> Explorer opens that file's folder with the
# file selected.
#
# This action is deliberately separate from "reveal": a link click carries no
# selection, so a contexts = ["selection"] action gets filtered out and the click
# falls through to herdr's default handling (which just opens the file).
[[actions]]
id = "reveal-link"
title = "Reveal clicked link in Explorer"
contexts = ["global"]
command = ["pwsh", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/open-path.ps1", "-Mode", "reveal"]

[[link_handlers]]
id = "file-url"
title = "Reveal in Explorer"
pattern = "^file:///.*$"
action = "reveal-link"
