id = "nunoras.project-colors"
name = "Project colors"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Give every project its own glyph in the sidebar, on its space and on each of its chats"
platforms = ["windows"]

# herdr has no per-space colour setting: the theme accent is global. What it does
# have is display-only metadata tokens, which the sidebar can render through a
# $name token in [ui.sidebar.spaces] / [ui.sidebar.agents]. Token *styles* are
# fixed in config, so the colour has to live in the value - hence an emoji,
# which carries its own colour.
#
# icons.json names a glyph per project and wins. colors.json is the fallback:
# an auto-assigned coloured square, so a project nobody has named still reads
# as distinct.
#
# The stamp is a full idempotent sync every time, so the trigger only has to be
# "something changed", never "exactly what changed".

# A new space, or a worktree opened into one, has no token yet.
[[events]]
on = "workspace.created"
command = ["pwsh", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/stamp-colors.ps1"]

[[events]]
on = "worktree.opened"
command = ["pwsh", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/stamp-colors.ps1"]

# A new pane needs its own token; the space's token does not cover its rows.
[[events]]
on = "pane.created"
command = ["pwsh", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/stamp-colors.ps1"]

# Self-heal. Metadata is display-only and does not survive a server restart;
# restored panes re-detect their agent, which puts every token back.
[[events]]
on = "pane.agent_detected"
command = ["pwsh", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/stamp-colors.ps1"]

[[actions]]
id = "sync"
title = "Project colors: restamp every space and chat"
description = "Re-apply the glyph to every workspace and pane. Run this after editing icons.json."
contexts = ["global"]
command = ["pwsh", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/stamp-colors.ps1"]

[[actions]]
id = "show"
title = "Project colors: show the assignment"
description = "Print which glyph each project got, and whether it came from icons.json or the colour palette."
contexts = ["global"]
command = ["pwsh", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/stamp-colors.ps1", "-Show"]
